services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - db-data:/app/data
      - chroma-data:/app/chroma_db
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/helix_srop.db
      - CHROMA_PERSIST_DIR=./chroma_db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  db-data:
  chroma-data:
